services:
  workbench:
    build: .
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    cap_add:
      - SYS_PTRACE
    environment:
      STILLPOINT_AI_URL: http://stillpoint-ai:11434
      STILLPOINT_AI_MODEL: ${STILLPOINT_AI_MODEL:-qwen2.5-coder:1.5b}
    depends_on:
      - stillpoint-ai
  stillpoint-ai:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    volumes:
      - ./.local/ollama:/root/.ollama
